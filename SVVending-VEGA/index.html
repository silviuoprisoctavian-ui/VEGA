.scan-entry-icon{display:grid;place-items:center;flex:0 0 52px;height:52px;border-radius:15px;background:#ffffff20;font-size:30px}.scan-entry-copy{flex:1;min-width:0}.scan-entry-copy strong{display:block;font-size:18px;line-height:1.25}.scan-entry-copy small{display:block;margin-top:5px;color:#e6f2ff;font-size:13px;line-height:1.45;font-weight:450}.scan-entry-arrow{font-size:34px;line-height:1;font-weight:400}.home-hint{text-align:center;color:var(--muted);font-size:13px;line-height:1.5;margin:13px 8px 0}@media(max-width:420px){.brand{gap:9px}.logo{height:48px;width:68px}.brand h1{font-size:14px}.brand p{font-size:11px}.home-screen{margin-top:22px}.home-logo{height:155px}.scan-entry{padding:17px 14px}.scan-entry-copy strong{font-size:16px}}</style><link rel="stylesheet" href="vega.css"></head><body><header><div class="brand"><img class="logo" src="logo.png" alt="Logo SV Vending Service"><div><h1>SV VENDING VEGA</h1><p>Gestión integral · Operaciones, servicio y clientes</p></div><button id="menuToggle" class="menu-button" type="button" onclick="toggleMenu()" aria-label="Abrir menú" aria-expanded="false" aria-controls="tabs">⋮</button></div></header><div id="menuBackdrop" class="menu-backdrop" onclick="closeMenu()" aria-hidden="true"></div><main class="wrap"><nav class="tabs" id="tabs" aria-label="Todas las opciones"></nav><div id="app"></div></main><div class="bottom"><div class="bottom-inner" id="bottom"></div></div><input type="file" id="restoreFile" accept="application/json" class="hidden"><input type="file" id="telemetryFile" accept=".csv,.xlsx,.xls,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" class="hidden"><input type="file" id="invoiceFile" accept=".pdf,image/*,.csv,.xlsx,.xls" class="hidden"><input type="file" id="productImportFile" accept=".csv,.xlsx,.xls" class="hidden"><div id="svCameraOverlay" aria-modal="true" role="dialog"><div class="svcam-head"><strong id="svCameraTitle">Escáner EAN</strong><select id="cameraChoice" aria const KEY='svvending_vega_v1';const blank=()=>({clients:[],machines:[],products:[],sales:[],expenses:[],payments:[],moves:[],imports:[],replenishments:[],bags:[],pendingBagVisits:[],stockCounts:[],vegaRecords:{},settings:{},replenishmentDraft:null});const DRAFT_KEY='svvending_vega_replenishment_draft';let db=load();let page='inicio',scanStream=null,scanTimer=null,scanContext=null,activeBagId=null,activeStockLocation='warehouse',basket={},pendingScannedProductId=null,wakeLockSentinel=null,wakeLockRequesting=false;function load(){try{return {...blank(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return blank()}}
let cloudToken=localStorage.getItem('sv_vega_sync_token')||'';
let cloudReady=false,cloudTimer=null,cloudBusy=false,cloudStatus='Sin conectar',cloudDirty=false,cloudUpdatedAt=null,cloudPollTimer=null;
function readLocalReplenishmentDraft(){try{return JSON.parse(localStorage.getItem(DRAFT_KEY)||'null')}catch{return null}}
function draftTime(draft){const value=Date.parse(draft?.updatedAt||'');return Number.isFinite(value)?value:0}
function newestReplenishmentDraft(a,b){if(!a)return b||null;if(!b)return a;return draftTime(a)>=draftTime(b)?a:b}
function persistDraftStorage(){try{if(db.replenishmentDraft)localStorage.setItem(DRAFT_KEY,JSON.stringify(db.replenishmentDraft));localStorage.setItem(KEY,JSON.stringify(db))}catch(e){console.warn('No se pudo guardar el borrador de reposición:',e.message)}}
function restoreDraftRuntime(){const draft=newestReplenishmentDraft(db.replenishmentDraft,readLocalReplenishmentDraft());if(draft){db.replenishmentDraft=draft;try{localStorage.setItem(DRAFT_KEY,JSON.stringify(draft))}catch{}if(draft.active){basket={...(draft.items||{})};pendingScannedProductId=draft.pendingProductId||null;scanContext={...(scanContext||{}),machineId:draft.machineId||''};page='reposicion'}else{basket={};pendingScannedProductId=null}}const pending=[...(db.pendingBagVisits||[])].sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''))[0];if(pending&&!draft?.active){page='reposicion';scanContext={...(scanContext||{}),machineId:pending.machineId,pendingBagVisitId:pending.id}}persistDraftStorage()}
function mergeRemoteState(remoteState){const incoming={...blank(),...remoteState};const localDraft=newestReplenishmentDraft(db.replenishmentDraft,readLocalReplenishmentDraft());const best=newestReplenishmentDraft(incoming.replenishmentDraft,localDraft);const localWins=!!(best&&localDraft&&best===localDraft&&draftTime(localDraft)>draftTime(incoming.replenishmentDraft));db={...incoming,replenishmentDraft:best||null};restoreDraftRuntime();localStorage.setItem(KEY,JSON.stringify(db));if(localWins)cloudDirty=true;return localWins}
function saveReplenishmentDraft(patch={}){const previous=db.replenishmentDraft||{};const input=document.getElementById('scannedUnits');const draft={...previous,...patch,active:true,machineId:patch.machineId??document.getElementById('machineSelect')?.value??scanContext?.machineId??previous.machineId??'',items:{...basket},pendingProductId:pendingScannedProductId,pendingUnits:patch.pendingUnits??input?.value??previous.pendingUnits??'1',updatedAt:new Date().toISOString()};db.replenishmentDraft=draft;persistDraftStorage();if(cloudReady){cloudDirty=true;scheduleCloudSave()}updateWakeLock()}
function clearReplenishmentDraft(){const draft={active:false,machineId:'',items:{},pendingProductId:null,pendingUnits:'1',updatedAt:new Date().toISOString()};db.replenishmentDraft=draft;persistDraftStorage();if(cloudReady){cloudDirty=true;scheduleCloudSave()}}
function shouldKeepScreenAwake(){return page==='reposicion'&&!!(db.replenishmentDraft?.active||(db.pendingBagVisits||[]).length)}
function updateWakeLockStatus(){const status=document.getElementById('wakeLockStatus');if(!status)return;if(!shouldKeepScreenAwake()){status.textContent='Borrador guardado automáticamente.';return}if(wakeLockSentinel&&!wakeLockSentinel.released){status.textContent='Pantalla activa durante la reposición · borrador guardado automáticamente.';return}status.textContent=('wakeLock'in navigator)?'Solicitando mantener la pantalla activa · borrador guardado automáticamente.':'El teléfono puede apagar la pantalla; la reposición se guarda automáticamente para recuperarla.'}
async function updateWakeLock(){updateWakeLockStatus();if(!shouldKeepScreenAwake()){if(wakeLockSentinel){try{await wakeLockSentinel.release()}catch{}wakeLockSentinel=null}updateWakeLockStatus();return}if(document.visibilityState!=='visible'||!('wakeLock'in navigator)||wakeLockSentinel&&!wakeLockSentinel.released||wakeLockRequesting)return;wakeLockRequesting=true;try{wakeLockSentinel=await navigator.wakeLock.request('screen');wakeLockSentinel.addEventListener('release',()=>{wakeLockSentinel=null;updateWakeLockStatus()});}catch(e){wakeLockSentinel=null;console.warn('No se pudo mantener activa la pantalla:',e.message)}finally{wakeLockRequesting=false;updateWakeLockStatus()}}
function restorePendingProductModal(){if(!pendingScannedProductId)return;const p=product(pendingScannedProductId),overlay=document.getElementById('svQuantityOverlay'),input=document.getElementById('scannedUnits');if(!p||!overlay)return;document.getElementById('svQuantityProduct').textContent=p.name+' · EAN '+(p.ean||'');if(input){input.value=db.replenishmentDraft?.pendingUnits||input.value||'1';input.oninput=()=>saveReplenishmentDraft({pendingUnits:input.value})}overlay.classList.add('open')}
function save(){localStorage.setItem(KEY,JSON.stringify(db));render();if(cloudReady){cloudDirty=true;scheduleCloudSave()}}
function scheduleCloudSave(){clearTimeout(cloudTimer);cloudTimer=setTimeout(pushCloudState,150)}
async function pushCloudState(){if(!cloudReady)return;if(cloudBusy){scheduleCloudSave();return;}cloudBusy=true;try{const r=await fetch('/api/vega-state',{method:'PUT',headers:{'Content-Type':'application/json','Authorization':'Bearer '+cloudToken},body:JSON.stringify({state:db})});if(!r.ok)throw new Error('HTTP '+r.status);localStorage.setItem('sv_vega_cloud_last_sync',new Date().toISOString());cloudDirty=false;cloudStatus='Conectado · última sincronización '+new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});}
catch(e){console.warn('No se pudo sincronizar con la nube:',e.message);cloudReady=false;cloudStatus='Error de sincronización';alert('No se pudo sincronizar con la nube. Los cambios siguen guardados en este navegador. Comprueba la conexión y vuelve a cargar la página para reconectar.');}
finally{cloudBusy=false;}}
async function initCloudSync(){if(!location.protocol.startsWith('http')||location.hostname==='localhost'||location.hostname==='127.0.0.1')return;
 if(!cloudToken){cloudToken=prompt('Introduce tu token privado de sincronización SV Vending VEGA. No lo compartas.','')||'';if(!cloudToken){cloudStatus='Falta el token';render();return;}localStorage.setItem('sv_vega_sync_token',cloudToken)}
 try{const r=await fetch('/api/vega-state',{headers:{'Authorization':'Bearer '+cloudToken}});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();
 if(data.state&&typeof data.state==='object'){const localDraft=newestReplenishmentDraft(db.replenishmentDraft,readLocalReplenishmentDraft());db={...blank(),...data.state};const best=newestReplenishmentDraft(db.replenishmentDraft,localDraft);const localDraftWins=!!(best&&localDraft&&best===localDraft&&draftTime(localDraft)>draftTime(db.replenishmentDraft));db.replenishmentDraft=best||null;cloudDirty=localDraftWins;restoreDraftRuntime();localStorage.setItem(KEY,JSON.stringify(db));cloudUpdatedAt=data.updatedAt||null;}
 else {const local=load();const hasLocal=Object.values(local).some(v=>Array.isArray(v)&&v.length>0)||!!local.replenishmentDraft?.active;if(hasLocal){db=local;const w=await fetch('/api/vega-state',{method:'PUT',headers:{'Content-Type':'application/json','Authorization':'Bearer '+cloudToken},body:JSON.stringify({state:db})});if(!w.ok)throw new Error('HTTP '+w.status);}else{db=blank();localStorage.setItem(KEY,JSON.stringify(db));}}
 cloudReady=true;cloudStatus='Conectado · sincronización automática en cada cambio';if(cloudDirty)scheduleCloudSave();render();startMinuteSync();console.log('Sincronización en nube activa; envío en cada cambio y recepción automática cada 3 segundos.');
 }catch(e){cloudReady=false;cloudStatus='Error de conexión ('+e.message+')';console.error('Sincronización en nube no disponible:',e.message);alert('No se ha podido conectar con la nube. La aplicación sigue en modo local. Comprueba que Render esté desplegado y que el token sea correcto.');render();}}
async function syncCloudMinute(){
 if(!cloudReady||cloudBusy||document.visibilityState==='hidden')return;
 cloudBusy=true;
 try{
  if(cloudDirty){
   const w=await fetch('/api/vega-state',{method:'PUT',headers:{'Content-Type':'application/json','Authorization':'Bearer '+cloudToken},body:JSON.stringify({state:db})});
   if(!w.ok)throw new Error('HTTP '+w.status);
   const saved=await w.json();cloudUpdatedAt=saved.updatedAt||cloudUpdatedAt;cloudDirty=false;
  }else{
   const r=await fetch('/api/vega-state',{headers:{'Authorization':'Bearer '+cloudToken},cache:'no-store'});
   if(!r.ok)throw new Error('HTTP '+r.status);
   const data=await r.json();
   if(data.state&&data.updatedAt&&data.updatedAt!==cloudUpdatedAt){
    mergeRemoteState(data.state);cloudUpdatedAt=data.updatedAt;if(cloudDirty)scheduleCloudSave();render();
   }
  }
  localStorage.setItem('sv_vega_cloud_last_sync',new Date().toISOString());
  cloudStatus='Conectado · última comprobación '+new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
 }catch(e){console.warn('Sincronización automática fallida:',e.message);cloudStatus='Error de sincronización ('+e.message+')';}
 finally{cloudBusy=false;if(page==='ajustes')render();}
}
function startMinuteSync(){if(cloudPollTimer)clearInterval(cloudPollTimer);cloudPollTimer=setInterval(syncCloudMinute,3000);}

function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function euro(n){return Number(n||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'})}function today(){return new Date().toISOString().slice(0,10)}function month(){return today().slice(0,7)}function title(t,s,b=''){return `<div class="page-title"><div><h2>${t}</h2><div class="sub">${s||''}</div></div>${b}</div>`}function stat(l,v,s=''){return `<div class="stat"><div class="label">${l}</div><strong>${v}</strong><small>${s}</small></div>`}function machine(id){return db.machines.find(m=>m.id===id)}function product(id){return db.products.find(p=>p.id===id)}function machineName(id){return machine(id)?.name||'Máquina sin asignar'}function clientName(id){return db.clients.find(c=>c.id===id)?.name||'Sin cliente'}function warehouseQty(pid){return db.moves.filter(m=>m.productId===pid&&m.location==='warehouse').reduce((n,m)=>n+(m.type==='in'?m.qty:-m.qty),0)}function machineQty(mid,pid){return db.moves.filter(m=>m.productId===pid&&m.location===mid).reduce((n,m)=>n+(m.type==='in'?m.qty:-m.qty),0)}function soldMonth(){return db.sales.filter(s=>(s.date||'').startsWith(month()))}const nav=[['inicio','⌂','Inicio'],['almacen','▤','Almacén'],['facturas','▧','Facturas'],['clientes','♙','Clientes'],['maquinas','▣','Máquinas'],['reposicion','▥','Escáner'],['bolsas','◉','Bolsas'],['recuento','☷','Recuento'],['comisiones','€','Comisiones'],['informes','▦','Informes'],['vega','✦','Gestión VEGA'],['ajustes','⚙','Ajustes']];let menuOpen=false;
function renderMenuState(){let menu=document.getElementById('tabs'),backdrop=document.getElementById('menuBackdrop'),button=document.getElementById('menuToggle');if(menu)menu.classList.toggle('open',menuOpen);if(backdrop)backdrop.classList.toggle('open',menuOpen);if(button){button.setAttribute('aria-expanded',String(menuOpen));button.setAttribute('aria-label',menuOpen?'Cerrar menú':'Abrir menú')}}

function render(){let menu=document.getElementById('tabs');if(menu)menu.innerHTML=nav.map(n=>`<button class="${(page===n[0]||(n[0]==='vega'&&page.startsWith('vega:')))?'active':''}" onclick="go('${n[0]}')">${n[2]}</button>`).join('')+'<div class="menu-separator" aria-hidden="true"></div><button onclick="importFrekuentFromMenu()">⇧ Importar Frekuent</button>';document.getElementById('bottom').innerHTML=nav.filter(n=>['inicio','almacen','maquinas','reposicion','bolsas','comisiones'].includes(n[0])).map(n=>`<button class="${page===n[0]?'active':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('');renderMenuState();let r=document.getElementById('app');({inicio:()=>r.innerHTML=home(),almacen:()=>r.innerHTML=warehouse(),facturas:()=>r.innerHTML=invoicesPage(),clientes:()=>r.innerHTML=clients(),maquinas:()=>r.innerHTML=machinesPage(),reposicion:()=>r.innerHTML=replenish(),bolsas:()=>r.innerHTML=bagsPage(),recuento:()=>r.innerHTML=stockCountPage(),comisiones:()=>r.innerHTML=commissions(),informes:()=>r.innerHTML=reports(),ajustes:()=>r.innerHTML=settings(),vega:()=>r.innerHTML=SVVega.home()})[page]?.();if(page.startsWith('vega:'))r.innerHTML=SVVega.modulePage(page.slice(5));if(page==='reposicion'){drawBasket();const select=document.getElementById('machineSelect'),mid=db.replenishmentDraft?.machineId||scanContext?.machineId||'';if(select&&mid){select.value=mid;showMachineInventory(mid)}restorePendingProductModal()}updateWakeLock()}function home(){return `<section class="home-screen"><div class="home-brand-card"><img class="home-logo" src="logo.png" alt="SV Vending Service"><h2>SV Vending VEGA</h2><p>Operaciones conectadas para vending</p></div><button class="scan-entry" type="button" onclick="startReplenishmentFromHome()"><span class="scan-entry-icon" aria-hidden="true">▥</span><span class="scan-entry-copy"><strong>Escanear máquina y reponer</strong><small>Pulsa para abrir la cámara, leer el QR de la máquina y empezar a escanear productos.</small></span><span class="scan-entry-arrow" aria-hidden="true">›</span></button><p class="home-hint">Al finalizar la reposición, podrás escanear la bolsa de recaudación.</p></section>`}function warehouse(){return `${title('Almacén de la nave','Stock central, compras y salidas',`<button onclick="productForm()">＋ Producto</button>`)}<div class="actions"><button onclick="document.getElementById('productImportFile').click()">⇧ Importar Excel / CSV</button><button class="secondary" onclick="exportProductCatalog()">⇩ Exportar catálogo</button><button class="secondary" onclick="stockPurchaseForm()">＋ Registrar compra</button><button class="secondary" onclick="go('reposicion')">Escanear reposición</button><button class="secondary" onclick="openStockCount('warehouse')">Recuento de stock</button></div><p class="sub">Importa un catálogo completo desde Excel o CSV. Las coincidencias por EAN actualizan productos existentes. El stock solo se carga si el archivo incluye una columna de stock.</p>${db.products.length?db.products.map(p=>`<div class="card"><div class="item-head"><div><h3>${esc(p.name)}</h3><p>${esc(p.category||'Sin categoría')} · EAN: ${esc(p.ean||'No indicado')}</p></div><span class="pill">${warehouseQty(p.id)} uds.</span></div><div class="rowline"><span>Coste / precio base</span><b>${euro(p.cost)} / ${euro(p.price)}</b></div><div class="rowline"><span>Stock mínimo</span><b>${p.minStock||0}</b></div><div class="actions"><button onclick="stockPurchaseForm('${p.id}')">＋ Entrada</button><button class="secondary" onclick="productForm('${p.id}')">Editar</button><button class="secondary" onclick="machineProductPrice('${p.id}')">Precios por máquina</button><button class="danger" onclick="deleteProduct('${p.id}')">Eliminar</button></div></div>`).join(''):'<div class="empty"><b>Almacén vacío</b>Añade tus productos con su EAN para empezar a escanear.</div>'}`}

function deleteProduct(pid){
 const p=product(pid);if(!p)return;
 const qty=warehouseQty(pid),used=db.moves.some(m=>m.productId===pid)||db.sales.some(x=>x.productId===pid);
 const msg=`¿Eliminar "${p.name}" del catálogo?\nStock calculado en almacén: ${qty} unidades.\n${used?'Tiene movimientos o ventas históricas; estos registros se conservarán, pero el producto dejará de aparecer en el catálogo.':''}\nEsta acción no se puede deshacer.`;
 if(!confirm(msg))return;
 db.products=db.products.filter(x=>x.id!==pid);
 save();page='almacen';render();
}
function exportProductCatalog(){
 const rows=[['EAN','Nombre','Categoría','Coste unitario','Precio base','Stock mínimo','Stock actual'],...db.products.map(p=>[p.ean||'',p.name,p.category||'',p.cost||0,p.price||0,p.minStock||0,warehouseQty(p.id)])];
 downloadCSV(rows,'sv-vending-catalogo-productos.csv');
}
async function importProductCatalog(file){
 let rows;
 if(/\.xlsx?$/i.test(file.name)){
  if(!window.XLSX)throw new Error('No se ha cargado el lector Excel. Guarda el archivo como CSV.');
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
  rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
 }else rows=parseCSV(await file.text());
 if(!rows||rows.length<2)throw new Error('El archivo no tiene filas de productos.');
 const heads=rows[0].map(String),summary={added:0,updated:0,skipped:0,stockAdded:0};
 const find=(r,names)=>val(r,heads,names);
 for(const row of rows.slice(1)){
  const name=find(row,['nombre','producto','descripcion','descripción','articulo','artículo','product','product name','description','name']);
  const ean=find(row,['ean','codigo ean','código ean','codigo de barras','código de barras','ean13','gtin','barcode','bar code']);
  if(!name&&!ean){summary.skipped++;continue}
  let p=(ean&&db.products.find(x=>String(x.ean||'').trim()===String(ean).trim()))||(name&&db.products.find(x=>norm(x.name)===norm(name)));
  const category=find(row,['categoria','categoría','category']);
  const costRaw=find(row,['coste unitario','coste','precio coste','precio de coste','unit cost','cost']);
  const priceRaw=find(row,['precio base','precio venta','precio de venta','price','sale price']);
  const minRaw=find(row,['stock minimo','stock mínimo','min stock','minimum stock']);
  const stockRaw=find(row,['stock inicial','stock actual','stock','existencias','quantity in stock','warehouse stock']);
  const cost=costRaw!==''?num(costRaw):null,price=priceRaw!==''?num(priceRaw):null,min=minRaw!==''?num(minRaw):null,stock=stockRaw!==''?num(stockRaw):null;
  if(p){
   if(name)p.name=name.trim();if(ean)p.ean=String(ean).trim();if(category)p.category=category;
   if(cost!==null)p.cost=cost;if(price!==null)p.price=price;if(min!==null)p.minStock=min;
   if(stock!==null&&!db.moves.some(m=>m.productId===p.id&&m.location==='warehouse')){db.moves.push({id:id(),productId:p.id,location:'warehouse',type:'in',qty:stock,date:today(),note:'Importación de catálogo '+file.name});summary.stockAdded+=stock}
   summary.updated++;
  }else{
   p={id:id(),name:String(name||ean).trim(),ean:String(ean||'').trim(),category:category||'',cost:cost??0,price:price??0,minStock:min??5};
   db.products.push(p);summary.added++;
   if(stock!==null&&stock!==0){db.moves.push({id:id(),productId:p.id,location:'warehouse',type:'in',qty:stock,date:today(),note:'Stock inicial importado desde '+file.name});summary.stockAdded+=stock}
  }
 }
 save();page='almacen';render();
 alert(`Importación terminada.\nProductos nuevos: ${summary.added}\nActualizados: ${summary.updated}\nFilas omitidas: ${summary.skipped}\nUnidades de stock añadidas: ${summary.stockAdded}`);
}

function productForm(pid=''){let p=product(pid)||{name:'',ean:'',category:'',cost:0,price:0,minStock:5};document.getElementById('app').innerHTML=`${title(pid?'Editar producto':'Nuevo producto','Escanea o introduce el EAN')}<div class="card"><form class="form" onsubmit="saveProduct(event,'${pid}')"><label>Nombre del producto<input name="name" required value="${esc(p.name)}" placeholder="Coca-Cola 330 ml"></label><label>Código de barras EAN<div class="two"><input id="eanField" name="ean" value="${esc(p.ean)}" placeholder="EAN-13 / EAN-8"><button type="button" onclick="startScanner('eanField')">📷 Escanear</button></div></label><label>Categoría<input name="category" value="${esc(p.category)}" placeholder="Bebidas, snacks, café..."></label><div class="two"><label>Coste unitario (€)<input name="cost" type="number" min="0" step="0.001" value="${p.cost}" required></label><label>Precio base (€)<input name="price" type="number" min="0" step="0.01" value="${p.price}" required></label></div><label>Stock mínimo de aviso<input name="minStock" type="number" min="0" step="1" value="${p.minStock||0}"></label><div class="form-actions"><button>Guardar producto</button><button type="button" class="secondary" onclick="go('almacen')">Cancelar</button></div></form><div id="scannerArea"></div></div>`}function saveProduct(e,pid){e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),p={id:pid||id(),...f,cost:+f.cost,price:+f.price,minStock:+f.minStock};if(p.ean&&db.products.some(x=>x.ean===p.ean&&x.id!==p.id)){alert('Ese EAN ya está asignado a otro producto.');return}if(pid)db.products=db.products.map(x=>x.id===pid?p:x);else{db.products.push(p);if(p.minStock>=0)db.moves.push({id:id(),productId:p.id,location:'warehouse',type:'in',qty:0,date:today(),note:'Stock inicial pendiente de registrar'})}save();page='almacen';render()}
function stockPurchaseForm(pid=''){let opts=db.products.map(p=>`<option value="${p.id}" ${p.id===pid?'selected':''}>${esc(p.name)} (${esc(p.ean||'sin EAN')})</option>`).join('');document.getElementById('app').innerHTML=`${title('Entrada de almacén','Registrar compra o mercancía recibida')}<div class="card"><form class="form" onsubmit="saveWarehouseIn(event)"><label>Producto<select name="productId" required>${opts}</select></label><label>Cantidad recibida<input name="qty" type="number" min="1" step="1" required></label><div class="two"><label>Coste unitario (€)<input name="cost" type="number" min="0" step="0.001"></label><label>Fecha<input name="date" type="date" value="${today()}" required></label></div><label>Proveedor / nota<input name="note" placeholder="Proveedor, factura... "></label><button>Guardar entrada</button></form></div>`}function saveWarehouseIn(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));db.moves.push({id:id(),productId:f.productId,location:'warehouse',type:'in',qty:+f.qty,date:f.date,note:f.note||'Compra'});if(f.cost!==''&&Number.isFinite(+f.cost))product(f.productId).cost=+f.cost;db.expenses.push({id:id(),category:'Compra de productos',amount:+f.qty*(+f.cost||product(f.productId).cost),date:f.date,note:f.note||product(f.productId).name});save();page='almacen';render()}
function clients(){return `${title('Clientes','Establecimientos y sus máquinas',`<button onclick="clientForm()">＋ Cliente</button>`)}${db.clients.length?db.clients.map(c=>`<div class="card"><div class="item-head"><div><h3>${esc(c.name)}</h3><p>${esc(c.contact||'')} ${c.phone?'· '+esc(c.phone):''}</p><p>${esc(c.address||'')}</p></div><span class="pill">${db.machines.filter(m=>m.clientId===c.id).length} máquinas</span></div><div class="actions"><button onclick="machineForm('', '${c.id}')">＋ Máquina</button><button class="secondary" onclick="clientForm('${c.id}')">Editar</button></div>${db.machines.filter(m=>m.clientId===c.id).map(m=>`<div class="rowline"><span>${esc(m.name)}</span><b>${esc(m.machineNo||'sin número')}</b></div>`).join('')}</div>`).join(''):'<div class="empty"><b>No hay clientes</b>Registra un establecimiento y después añade sus máquinas.</div>'}`}
function clientForm(cid=''){let c=db.clients.find(x=>x.id===cid)||{name:'',contact:'',phone:'',address:''};document.getElementById('app').innerHTML=`${title(cid?'Editar cliente':'Nuevo cliente','Datos del establecimiento')}<div class="card"><form class="form" onsubmit="saveClient(event,'${cid}')"><label>Nombre del cliente / establecimiento<input name="name" required value="${esc(c.name)}"></label><label>Persona de contacto<input name="contact" value="${esc(c.contact)}"></label><label>Teléfono<input name="phone" value="${esc(c.phone)}"></label><label>Dirección<input name="address" value="${esc(c.address)}"></label><button>Guardar cliente</button></form></div>`}function saveClient(e,cid){e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),c={id:cid||id(),...f};if(cid)db.clients=db.clients.map(x=>x.id===cid?c:x);else db.clients.push(c);save();page='clientes';render()}

missionValue,prices:old.prices||{},productCommissions:old.productCommissions||{},active:true};if(mid)db.machines=db.machines.map(x=>x.id===mid?m:x);else db.machines.push(m);save();page='maquinas';render()}

function reports(){let s=soldMonth(),manualSales=s.filter(x=>String(x.source||'').toLowerCase().startsWith('manual')),frekuentSales=s.filter(x=>String(x.source||'').toLowerCase().includes('frekuent')),rankProducts=rows=>{let o={};rows.forEach(x=>{let k=x.productName||'Producto sin identificar';o[k]=(o[k]||0)+(Number(x.units)||1)});return Object.entries(o).sort((a,b)=>b[1]-a[1])},manualRank=rankProducts(manualSales),frekuentRank=rankProducts(frekuentSales),needBuy=db.products.map(p=>({p,qty:Math.max(0,Number(p.minStock||0)-warehouseQty(p.id))})).filter(x=>x.qty>0).sort((a,b)=>b.qty-a.qty),revenue=s.reduce((a,x)=>a+x.total,0),comm=s.reduce((a,x)=>a+x.commission,0),purchases=db.expenses.filter(x=>x.category==='Compra de productos'&&x.date.startsWith(month())).reduce((a,x)=>a+x.amount,0),expenses=db.expenses.filter(x=>x.date.startsWith(month())).reduce((a,x)=>a+x.amount,0);let perProduct={};s.forEach(x=>{let k=x.productName||'Producto sin identificar';perProduct[k]=(perProduct[k]||0)+(Number(x.units)||1)});return `${title('Informes mensuales','Resumen de '+month(),`<button onclick="exportReport()">Exportar CSV</button>`)}<div class="section"><h3>🛒 Productos que hace falta comprar</h3><p class="sub">Calculado comparando el stock actual de la nave con el stock mínimo que configuraste para cada producto. Si el stock está en negativo, se recomienda comprar más.</p>${needBuy.length?`<div class="card"><div class="table-wrap"><table><thead><tr><th>Producto</th><th>Stock actual</th><th>Mínimo</th><th>Comprar al menos</th></tr></thead><tbody>${needBuy.map(x=>`<tr><td>${esc(x.p.name)}</td><td>${warehouseQty(x.p.id)}</td><td>${Number(x.p.minStock||0)}</td><td><b>${x.qty}</b></td></tr>`).join('')}</tbody></table></div><div class="actions"><button onclick="exportPurchaseList()">Exportar lista de compra CSV</button></div></div>`:'<div class="success">No hay productos por debajo del stock mínimo.</div>'}</div><div class="section"><h3>🏆 Lo que más se vende · Manual</h3><p class="sub">Según los registros manuales de este mes.</p>${manualRank.length?manualRank.slice(0,10).map(([name,qty],i)=>`<div class="rowline"><span>${i+1}. ${esc(name)}</span><b>${qty} uds.</b></div>`).join(''):'<p class="sub">Todavía no hay ventas manuales este mes.</p>'}</div><div class="section"><h3>📊 Lo que más se vende · Frekuent</h3><p class="sub">Según la última exportación importada, filtrada al mes actual.</p>${frekuentRank.length?frekuentRank.slice(0,10).map(([name,qty],i)=>`<div class="rowline"><span>${i+1}. ${esc(name)}</span><b>${qty} uds.</b></div>`).join(''):'<p class="sub">Importa un informe de Frekuent para ver el ranking.</p>'}</div><div class="grid">${stat('Ventas netas',euro(revenue),s.length+' transacciones')}${stat('Comisiones',euro(comm),'Estimadas')}${stat('Compras registradas',euro(purchases),'Mercancía para almacén')}${stat('Gastos registrados',euro(expenses),'Incluye compras')}</div><div class="section"><h3>Ventas por máquina</h3>${db.machines.map(m=>{let rows=s.filter(x=>x.machineId===m.id);return `<div class="card"><div class="item-head"><h3>${esc(m.name)}</h3><b>${euro(rows.reduce((a,x)=>a+x.total,0))}</b></div><div class="rowline"><span>${rows.length} ventas</span><span>Comisión ${euro(rows.reduce((a,x)=>a+x.commission,0))}</span></div></div>`}).join('')||'<div class="empty">Sin máquinas registradas.</div>'}</div><div class="section"><h3>Productos vendidos (unidades)</h3>${Object.entries(perProduct).map(([k,v])=>`<div class="rowline"><span>${esc(k)}</span><b>${v}</b></div>`).join('')||'<p class="sub">Importa ventas para ver productos vendidos.</p>'}</div><div class="section"><h3>Gastos y pagos</h3><button onclick="expenseForm()">＋ Añadir gasto</button><button class="secondary" onclick="paymentForm()">＋ Registrar pago</button>${db.expenses.filter(x=>x.date.startsWith(month())).map(x=>`<div class="rowline"><span>${esc(x.category)} · ${esc(x.date)}</span><b>${euro(x.amount)}</b></div>`).join('')}</div><div class="section"><h3>Historial de importaciones</h3>${db.imports.slice(-5).reverse().map(x=>`<div class="rowline"><span>${esc(x.file)} · ${esc(x.date)}</span><b>${x.added} nuevas</b></div>`).join('')||'<p class="sub">Todavía no hay importaciones.</p>'}</div>`}

function settings(){const last=localStorage.getItem('sv_vega_cloud_last_sync');const status=cloudReady?'Conectado a PostgreSQL':cloudStatus;return `${title('Ajustes','Copias, importación y sincronización')}<div class="card"><h3>Importar ventas de Frekuent</h3><p class="sub">Admite CSV detallado de Frekuent y Excel (.xlsx). Las compras completadas se importan como transacciones; los registros repetidos se omiten.</p><button onclick="document.getElementById('telemetryFile').click()">Seleccionar CSV / Excel</button><div class="sub" style="margin-top:8px">En el CSV de ejemplo, se identifican las columnas Fecha, Nombre Máquina, Número de Máquina, Producto, Tipo de transacción, Estado de compra e Importe Neto.</div></div><div class="card"><h3>Copia de seguridad</h3><p class="sub">Descarga una copia antes de hacer cambios importantes.</p><div class="actions"><button onclick="backup()">Descargar copia JSON</button><button class="secondary" onclick="document.getElementById('restoreFile').click()">Restaurar copia</button></div></div><div class="card"><h3>Sincronización en la nube</h3><div class="${cloudReady?'success':'notice'}"><b>${esc(status)}</b><p class="sub">${cloudReady?'Cada cambio guardado se envía automáticamente a PostgreSQL en unos instantes y se comprueban los cambios del otro dispositivo aproximadamente cada 3 segundos. La aplicación debe permanecer abierta y conectada a internet.': 'La aplicación aún no confirma conexión con PostgreSQL. Revisa el token y el estado del servidor.'}</p>${last?'<p class="sub">Último guardado correcto: '+esc(new Date(last).toLocaleString('es-ES'))+'</p>':''}</div><div class="actions"><button onclick="retryCloudSync()">Comprobar / conectar nube</button><button class="secondary" onclick="syncNow()">Sincronizar ahora</button></div><p class="sub">No compartas el token. Los datos solo se sincronizan después de conectar correctamente.</p></div><div class="card"><h3>Privacidad y datos</h3><p class="sub">Los datos se guardan localmente y, cuando la nube está conectada, también en PostgreSQL.</p><button class="danger" onclick="resetData()">Borrar todos los datos locales</button></div><p class="sub">SV Vending VEGA · Datos y sincronización independientes</p>`} 
async function retryCloudSync(){if(cloudReady){cloudStatus='Conectado a PostgreSQL';render();return}cloudToken=localStorage.getItem('sv_vega_sync_token')||'';if(!cloudToken){cloudToken=prompt('Introduce el token privado VEGA_SYNC_TOKEN de Render. No lo compartas.','')||'';if(!cloudToken)return;localStorage.setItem('sv_vega_sync_token',cloudToken)}await initCloudSync()}

let invoiceDraft=[];let invoiceFileName='';let invoiceNumber='';
function normalizeInvoiceNumber(v){return norm(String(v||'').replace(/^(?:n[uú]mero\s*(?:de\s*)?factura|factura|n[º°.]?\s*factura|invoice\s*(?:number|no\.?))\s*[:#-]?\s*/i,'').replace(/\s+/g,'').replace(/[\-\/]/g,''))}
function extractInvoiceNumber(text){const t=String(text||'').replace(/[\t ]+/g,' ');const patterns=[/(?:n[uú]mero\s*(?:de\s*)?factura|n[º°.]?\s*factura|factura\s*(?:n[uú]m(?:ero)?|n[º°.]?)|invoice\s*(?:number|no\.?|#)|invoice\s*#)\s*[:#-]?\s*([A-Z0-9][A-Z0-9\/-]{2,})/i,/(?:FACTURA)\s*[:#-]\s*([A-Z0-9][A-Z0-9\/-]{2,})/i];for(const re of patterns){const m=t.match(re);if(m)return m[1].trim()}return ''}
function duplicateInvoice(number){const key=normalizeInvoiceNumber(number);return !!key&&(db.purchases||[]).some(x=>normalizeInvoiceNumber(x.invoiceNumber)===key)}
function invoicesPage(){let history=(db.purchases||[]).slice().reverse();return `${title('Facturas y albaranes','Sube el PDF, foto, CSV o Excel del proveedor para preparar la entrada de stock',`<button onclick="document.getElementById('invoiceFile').click()">＋ Subir factura</button>`)}<div class="notice"><b>Cómo funciona:</b> la app intenta leer los productos, cantidades y precios de coste. Antes de actualizar el stock, podrás revisar y corregir cada línea. Las facturas escaneadas pueden necesitar revisión manual; no se contabiliza nada hasta que confirmes.</div><div class="card"><h3>Importar documento</h3><p class="sub">Admite PDF, fotos JPG/PNG y archivos CSV/Excel. Los documentos se procesan en este navegador.</p><button onclick="document.getElementById('invoiceFile').click()">Seleccionar factura o albarán</button><div id="invoiceStatus" class="sub" style="margin-top:10px"></div></div><div id="invoiceReview">${renderInvoiceDraft()}</div><div class="section"><h3>Documentos contabilizados</h3>${history.length?history.map(x=>`<div class="card"><div class="item-head"><div><b>${esc(x.fileName||'Documento')}</b><p>${esc(x.date||'')} · ${x.lines||0} líneas de producto${x.invoiceNumber?' · Factura n.º '+esc(x.invoiceNumber):''}</p></div><b>${euro(x.totalCost||0)}</b></div><div class="sub">Entrada de stock confirmada · Costes actualizados según el documento</div></div>`).join(''):'<div class="empty">Todavía no has contabilizado facturas ni albaranes.</div>'}</div>`}
function renderInvoiceDraft(){
  if(!Array.isArray(invoiceDraft)||invoiceDraft.length===0)return '';
  const linesHtml=invoiceDraft.map((line,idx)=>{
    const safeLine=line||{};
    const options=db.products.map(prod=>`<option value="${esc(prod.id)}" ${safeLine.productId===prod.id?'selected':''}>${esc(prod.name)} · ${esc(prod.ean||'sin EAN')}</option>`).join('');
    const qty=Number(safeLine.qty)||0;
    const cost=Number(safeLine.cost)||0;
    const description=esc(safeLine.description||'');
    const isNew=!safeLine.productId;
    const createNew=safeLine.createNew!==false;
    return `<div class="card"><div class="form">
      ${isNew?`<div class="notice" style="border-color:#f59e0b"><b>⚠️ Producto nuevo o no reconocido</b><p class="sub">Este producto no aparece en tu catálogo. Puedes añadirlo con el nombre de la factura.</p><label><input type="checkbox" ${createNew?'checked':''} onchange="invoiceDraft[${idx}].createNew=this.checked;updateInvoiceTotal()"> Añadir este producto al catálogo al confirmar</label><label>Nombre con el que se guardará<input value="${esc(safeLine.newProductName||safeLine.description||'')}" onchange="invoiceDraft[${idx}].newProductName=this.value"></label></div>`:`<label>Producto reconocido<select onchange="invoiceDraft[${idx}].productId=this.value;updateInvoiceTotal()"><option value="">Selecciona producto…</option>${options}</select></label>`}
      <label>Descripción en factura<input value="${description}" onchange="invoiceDraft[${idx}].description=this.value"></label>
      ${isNew?`<label>EAN / código de barras (si aparece)<input value="${esc(safeLine.ean||'')}" onchange="invoiceDraft[${idx}].ean=this.value" placeholder="Opcional"></label>`:''}
      <div class="two"><label>Cantidad<input type="number" min="0" step="0.01" value="${qty}" onchange="invoiceDraft[${idx}].qty=Number(this.value);updateInvoiceTotal()"></label>
      <label>Coste unitario (€)<input type="number" min="0" step="0.0001" value="${cost}" onchange="invoiceDraft[${idx}].cost=Number(this.value);updateInvoiceTotal()"></label></div>
      <div class="sub">Subtotal: <b id="invoiceSub${idx}">${euro(qty*cost)}</b></div>
    </div></div>`;
  }).join('');
  const grandTotal=invoiceDraft.reduce((sum,line)=>sum+(Number(line?.qty)||0)*(Number(line?.cost)||0),0);
  return `<div class="section"><h3>Revisar antes de añadir al stock</h3><p class="sub">Documento: ${esc(invoiceFileName)}. Comprueba que el producto, la cantidad y el coste unitario coincidan con la factura.</p><div class="card"><p><b>Número de factura detectado automáticamente:</b> ${invoiceNumber?`<span>${esc(invoiceNumber)}</span>`:`<span style="color:#b45309">No se ha podido identificar</span>`}</p><p class="sub">La aplicación lo extrae del documento y comprueba si ya existe. Si no logra identificarlo, no permitirá contabilizar la factura para evitar duplicar stock.</p></div>${linesHtml}<div class="card"><div class="item-head"><b>Total de líneas</b><strong id="invoiceGrandTotal">${euro(grandTotal)}</strong></div><p class="sub">Solo se actualizará el stock cuando confirmes.</p><div class="actions"><button onclick="confirmInvoice()">Confirmar compra y sumar stock</button><button class="secondary" onclick="invoiceDraft=[];render()">Cancelar</button></div></div></div>`;
}

function matchInvoiceProduct(description){

  if(!d)return null;

  let exact=db.products.find(p=>compact(p.name)===dc||dc.includes(compact(p.name))||compact(p.name).includes(dc));
  if(exact)return exact;
  const ignored=new Set(['pack','caja','cajas','caj','uds','ud','unidad','unidades','de','del','la','el','y','con']);
  const tokens=d.split(' ').filter(t=>t.length>1&&!ignored.has(t)&&!/^\d+$/.test(t));
  let best=null,bestScore=0,second=0;

}
